      <nav class="sidebar-nav" aria-label="Navegação principal">

      <div class="sidebar-section">

        </div>
        <div class="space-tree" id="space-tree">
          <button class="tree-item space-row" type="button" data-tree-toggle aria-expanded="true">
            <span class="space-dot" style="--dot-color: #49ccf9"></span>
            <span class="tree-label">Marketing</span>
            <svg class="icon tree-chevron"><use href="#i-chevron-down"></use></svg>
          </button>
          <div class="tree-children">
            <button class="tree-item folder-row" type="button" data-tree-toggle aria-expanded="true">
              <svg class="icon"><use href="#i-folder"></use></svg>
              <span class="tree-label">Campanhas</span>
              <svg class="icon tree-chevron"><use href="#i-chevron-down"></use></svg>
            </button>
            <div class="tree-children">
              <button class="tree-item list-row is-active" type="button" id="board-list-btn" title="Site institucional">
                <svg class="icon"><use href="#i-columns"></use></svg>
                <span class="tree-label">Site institucional</span>
              </button>
            </div>
          </div>
          <button class="tree-item space-row is-collapsed" type="button" data-tree-toggle aria-expanded="false">

      <div class="sidebar-footer">

            <svg class="icon"><use href="#i-settings"></use></svg>
          </button>

    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <div class="main">

        </button>
        <nav class="breadcrumbs" id="breadcrumbs" aria-label="Trilha de navegação">

          <svg class="icon crumb-separator"><use href="#i-chevron-right"></use></svg>
          <span>Campanhas</span>
          <svg class="icon crumb-separator"><use href="#i-chevron-right"></use></svg>
          <strong>Site institucional</strong>
        </nav>
        <div class="topbar-actions">
          <button class="icon-btn" type="button" id="theme-toggle" aria-label="Ativar tema escuro" title="Ativar tema escuro">
            <svg class="icon theme-icon theme-moon"><use href="#i-moon"></use></svg>
            <svg class="icon theme-icon theme-sun"><use href="#i-sun"></use></svg>

          <button class="icon-btn" type="button" id="notifications-btn" aria-label="Notificações" title="Notificações">

            <span class="notification-dot" id="notification-dot" hidden></span>
          </button>
          <button class="btn btn-outline topbar-invite" type="button" id="invite-topbar">
            <svg class="icon"><use href="#i-user-plus"></use></svg>
            <span>Convidar</span>
          </button>
          <button class="avatar avatar-sm avatar-user topbar-profile" type="button" id="profile-btn" title="Meu perfil" aria-label="Abrir configurações do perfil">W</button>
        </div>
      </header>

      <section class="list-header" aria-labelledby="list-title">
        <div class="list-title-row">
          <div class="list-title-group">
            <span class="list-icon" aria-hidden="true">
              <svg class="icon"><use id="list-icon-use" href="#i-columns"></use></svg>
            </span>
            <h1 id="list-title">Site institucional</h1>
            <button class="icon-btn star-btn" type="button" id="favorite-btn" aria-label="Adicionar aos favoritos" aria-pressed="false" title="Adicionar aos favoritos">
              <svg class="icon"><use href="#i-star"></use></svg>
            </button>
          </div>
          <div class="header-actions">
            <div class="avatar-stack" id="header-avatars" aria-label="Membros do quadro"></div>

              <svg class="icon"><use href="#i-share"></use></svg>
              <span>Compartilhar</span>
            </button>
            <button class="btn btn-primary" type="button" id="new-task-btn">
              <svg class="icon"><use href="#i-plus"></use></svg>
              <span>Nova tarefa</span>
            </button>
          </div>
        </div>

        <div class="view-tabs-row">
          <nav class="view-tabs" id="view-tabs" aria-label="Visualizações"></nav>
          <button class="icon-btn view-settings" type="button" id="view-settings-btn" aria-label="Configurações da visualização" title="Configurações da visualização">
            <svg class="icon"><use href="#i-settings"></use></svg>
          </button>
        </div>
      </section>

          <div class="menu-anchor">
            <button class="tool-btn" type="button" id="filter-btn" data-popover-trigger aria-expanded="false" aria-controls="filter-popover">

              <span>Filtrar</span>
              <span class="tool-badge" id="filter-badge" hidden>0</span>
            </button>

              <div class="popover-head">
                <strong>Filtrar tarefas</strong>
                <button class="icon-btn" type="button" id="filter-close" aria-label="Fechar filtros">
                  <svg class="icon"><use href="#i-x"></use></svg>
                </button>
              </div>
              <div class="popover-section">
                <span class="popover-label">Prioridade</span>
                <div class="filter-options" id="filter-priorities"></div>
              </div>
              <div class="popover-section">
                <span class="popover-label">Responsável</span>
                <div class="filter-options" id="filter-assignees"></div>
              </div>
              <div class="popover-footer">
                <button class="btn btn-text" type="button" id="clear-filters">Limpar</button>
                <button class="btn btn-primary btn-sm" type="button" id="apply-filters">Concluir</button>
              </div>
            </div>
          </div>

            <button class="tool-btn" type="button" id="sort-btn" data-popover-trigger aria-expanded="false" aria-controls="sort-popover">

              <span>Classificar</span>
            </button>
            <div class="popover sort-popover" id="sort-popover" hidden>
              <div class="popover-head">
                <strong>Classificar por</strong>
                <button class="icon-btn" type="button" id="sort-close" aria-label="Fechar classificação">
                  <svg class="icon"><use href="#i-x"></use></svg>
                </button>
              </div>
              <div class="sort-options">
                <button class="sort-option" type="button" data-sort="manual">
                  <span>Manual</span>
                  <svg class="icon sort-check"><use href="#i-check"></use></svg>
                </button>
                <button class="sort-option" type="button" data-sort="priority">
                  <span>Prioridade</span>
                  <svg class="icon sort-check"><use href="#i-check"></use></svg>
                </button>
                <button class="sort-option" type="button" data-sort="due">
                  <span>Data de vencimento</span>
                  <svg class="icon sort-check"><use href="#i-check"></use></svg>
                </button>
                <button class="sort-option" type="button" data-sort="title">
                  <span>Título</span>
                  <svg class="icon sort-check"><use href="#i-check"></use></svg>
                </button>
              </div>
            </div>
          </div>

            <svg class="icon"><use href="#i-search"></use></svg>
            <input id="search-input" type="search" placeholder="Pesquisar tarefas" autocomplete="off" aria-label="Pesquisar tarefas">

              <svg class="icon"><use href="#i-x"></use></svg>
            </button>
          </label>

                <span>Exportar quadro</span>
              </button>
              <div class="menu-separator"></div>
              <button class="menu-item menu-item-danger" type="button" id="clear-completed">
                <svg class="icon"><use href="#i-check-circle"></use></svg>
                <span>Limpar concluídas</span>
                <span class="menu-count" id="done-count">0</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <div class="active-filters" id="active-filters" hidden></div>

      <main class="board-wrap" id="board-wrap">
        <div class="board" id="board" aria-label="Quadro Kanban"></div>
      </main>

      <main class="module-wrap" id="module-wrap" hidden></main>
    </div>
  </div>

  <div class="task-menu" id="task-menu" role="menu" hidden></div>
  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="false"></div>
  <div class="sr-only" id="sr-announcer" aria-live="polite"></div>

  <dialog class="task-dialog" id="task-dialog" aria-labelledby="task-dialog-title">
    <form class="task-modal" id="task-form">
      <header class="task-modal-header">
        <div class="task-modal-breadcrumb">
          <svg class="icon"><use href="#i-columns"></use></svg>
          <span>Site institucional</span>
          <svg class="icon task-crumb-separator"><use href="#i-chevron-right"></use></svg>
          <span class="task-code" id="task-code">Nova tarefa</span>
        </div>
        <button class="icon-btn" type="button" id="task-close" aria-label="Fechar tarefa">
          <svg class="icon"><use href="#i-x"></use></svg>
        </button>
      </header>

      <div class="task-modal-body">
        <div class="task-modal-main">
          <h2 class="sr-only" id="task-dialog-title">Tarefa</h2>
          <input type="hidden" id="task-id">
          <label class="sr-only" for="task-title">Título da tarefa</label>
          <input class="task-title-field" id="task-title" type="text" placeholder="Título da tarefa" maxlength="140" required autocomplete="off">
          <div class="task-description-block">
            <label for="task-description">Descrição</label>
            <textarea id="task-description" placeholder="Adicione uma descrição ou cole um link..." maxlength="1200"></textarea>
          </div>
        </div>

        <aside class="task-modal-properties" aria-label="Propriedades da tarefa">
          <div class="property-field">
            <label for="task-status">Status</label>
            <div class="select-control">
              <span class="status-dot" id="task-status-dot"></span>
              <select id="task-status">
                <option value="todo">A fazer</option>
                <option value="doing">Em andamento</option>
                <option value="done">Concluído</option>
              </select>
              <svg class="icon select-chevron"><use href="#i-chevron-down"></use></svg>
            </div>
          </div>

          <div class="property-field">
            <label for="task-assignee">Responsável</label>
            <div class="select-control">
              <select id="task-assignee"></select>
              <svg class="icon select-chevron"><use href="#i-chevron-down"></use></svg>
            </div>
          </div>

          <div class="property-field">
            <label for="task-priority">Prioridade</label>
            <div class="select-control">
              <span class="priority-dot" id="task-priority-dot"></span>
              <select id="task-priority">
                <option value="urgent">Urgente</option>
                <option value="high">Alta</option>
                <option value="normal">Normal</option>
                <option value="low">Baixa</option>
              </select>
              <svg class="icon select-chevron"><use href="#i-chevron-down"></use></svg>
            </div>
          </div>

          <div class="property-field">
            <label for="task-due">Vencimento</label>
            <input class="property-input" id="task-due" type="date">
          </div>

          <div class="property-field">
            <label for="task-tags">Etiquetas</label>
            <input class="property-input" id="task-tags" type="text" placeholder="design, site, urgente" maxlength="160" autocomplete="off">
            <span class="property-hint">Separe por vírgula</span>
          </div>
        </aside>
      </div>

      <footer class="task-modal-footer">
        <button class="btn btn-danger-text" type="button" id="task-delete" hidden>
          <svg class="icon"><use href="#i-trash"></use></svg>
          <span>Excluir</span>
        </button>
        <div class="task-footer-actions">
          <button class="btn btn-text" type="button" id="task-cancel">Cancelar</button>
          <button class="btn btn-primary" type="submit" id="task-save">Criar tarefa</button>
        </div>
      </footer>
    </form>
  </dialog>

  <dialog class="app-dialog" id="app-dialog" aria-labelledby="app-dialog-title">
    <form class="app-dialog-form" id="app-dialog-form">
      <header class="app-dialog-header">
        <div class="app-dialog-heading">
          <span class="app-dialog-eyebrow" id="app-dialog-eyebrow" hidden></span>
          <h2 id="app-dialog-title">Configurações</h2>
          <p class="app-dialog-subtitle" id="app-dialog-subtitle" hidden></p>
        </div>
        <button class="icon-btn" type="button" data-dialog-close aria-label="Fechar">
          <svg class="icon"><use href="#i-x"></use></svg>
        </button>
      </header>
      <div class="app-dialog-body" id="app-dialog-body"></div>
      <footer class="app-dialog-footer" id="app-dialog-footer">
        <button class="btn btn-text" type="button" data-dialog-close id="app-dialog-cancel">Cancelar</button>
        <button class="btn btn-primary" type="submit" id="app-dialog-submit">Salvar</button>
      </footer>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
